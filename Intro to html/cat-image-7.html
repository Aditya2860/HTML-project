<!DOCTYPE html>
<html>
    <head>
        <title>cat image</title>
        <style>
            .image1{
                width: 300px;
                border-radius: 33px;
                
                
                
            }
            .image2{
                width: 200px;
                height: 200px;
                margin-left: 30px;
                object-fit: cover;
                object-position: -120px;
            }
            .image3{
                width: 200px;
                height: 200px;
                margin-left: 30px;

                object-position: -120px;
                border-radius: 100px;
            }
        </style>
    </head>
    <body>
        <img class="image1" src="image.png">
        <img class="image2" src="image.png">
        <img class="image3" src="image.png"
    </body>
</html>
