<!DOCTYPE html>
<html>
  <head>
    <title>service queary</title>
    <style>
      div{
        font-family: arial;
        font-weight: 700;
        margin-top: 25px;
        margin-left: 15px;
        border-style: solid;
        padding-bottom: 15px;
        padding-left: 15px;
        padding-right: 95px;
        border-color: rgba(0, 0, 0, 0.288);
        display: inline-block;
        box-shadow:0 0 15px rgb(0, 0, 0,0.4);
        border-width: 0.1px;
      }
      button{
        margin-right: 4px;
        font-weight: bold;
        transition:  box-shadow 0.15s ,opacity 0.11s;
      }
      button:hover{
        box-shadow:0 0 5px rgb(0, 0, 0,0.3);
      }
      button:active{
        opacity: 0.6;
      }
      
    </style>
  </head>
  <body>
    <div>
      <p>Satisfied with our service &#63;</p>
      <button>Yes</button>
      <button>No</button>
    </div>
  </body>
</html>
