<!DOCTYPE html>
<html>
    <head>
        <title>Linkdin signup</title>
        <style>
            p{
                font-family: arial;
                color: rgb(101, 96, 96);
                font-size:24px;
                font-weight: 3px;
            }
            .email{                
                margin-top:0px;
                margin-bottom: 0px;
            }
            .box{
                font-size: 30px;
                font-family: Arial;
                border-radius: 6px;
                border-width: 3px;
                width: 590px;
                margin-top: 7px;
            }
            .button{
                background-color: blue;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 30px;
                padding-top: 18px;
                padding-bottom: 18px;
                padding-left: 200px;
                padding-right: 200px;
                margin-left: 4px;
                border-radius: 68px;

            }
        </style>
    </head>
    <body>
        <p class="email">Email</p>
        <input class="box" type="email" >
        <p>
            By clicking Agree & Join,you agree to the Privacy Policy.
        </p>
        <button class="button">Agree & Join</button>
    </body>
</html>
