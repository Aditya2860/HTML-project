<!DOCTYPE html>
<html>
  <head>
    <title> Grid practice</title>
  </head>
  <body style="height: 1000px;">
    <div style="display: grid;
                grid-template-columns:100px 100px 200px 400px;
               
    ">
      <div style="background-color: rgb(173, 216, 230);">Div 1</div>
      <div style="background-color: lightpink;">Div 2<p> text</p></div>
      <div style="background-color: lightcoral;">aaaaanvvvvvvei</div>
    </div>

    <div style="display: grid;
                grid-template-columns:100px 100px;
                margin-top: 30px;
    ">
      <div style="background-color: lightblue;">100px</div>
      <div style="background-color: lightpink;">200px</div>
    </div>
    
  <div style="display: grid;
  grid-template-columns:100px 1fr;
  margin-top: 30px;
  ">
    <div style="background-color: lightblue;">100px</div>
    <div style="background-color: lightpink;">1fr</div>
  </div>

  <div style="display: grid;
  grid-template-columns:100px 1fr 3fr;
  margin-top: 30px;
  ">
    <div style="background-color: lightblue;">100px</div>
    <div style="background-color: lightpink;">1fr</div>
    <div style="background-color: rgb(253, 19, 54);">3fr</div>
  </div>

  
  <div style="display: grid;
  grid-template-columns:1fr 1fr 1fr;
  margin-top: 30px;
  column-gap:20px;
  row-gap: 20px;

  ">
    <div style="background-color: lightblue; height: 200px;">1fr</div>
    <div style="background-color: lightpink;">1fr</div>
    <div style="background-color: lightblue;">1fr</div>
    <div style="background-color: lightblue; height: 200px;">1fr</div>
    <div style="background-color: lightpink;">1fr</div>
    <div style="background-color: lightblue;">1fr</div>
  </div>
  </body>
</html>
