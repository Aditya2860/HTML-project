<!doctype html>
<html>
  <head>
    <title>Red block & green circle</title>
    <style>
      .red-block{
        background-color: red;
        height: 40px;
        width: 40px;
        display: inline-block;
      }
      .green-circle{
        background-color: green;
        height: 40px;
        width: 40px;
        border-radius: 20px;
        display: inline-block;
        margin-left: 30px;
      }
    </style>
  </head>
  <body>
    <div class="red-block"></div>
    <div class="green-circle"></div>
  </body>
</html>
